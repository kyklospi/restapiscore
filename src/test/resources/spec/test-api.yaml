openapi: 3.0.3
info:
  title: Mini Library API
  version: 1.0.0
  description: A test API used for attributes test.
  contact:
    name: Library Team
servers:
  - url: https://api.example.com/v1
security:
  - bearer: []
paths:
  /books:
    get:
      operationId: listBooks
      summary: List books
      parameters:
        - name: limit
          in: query
          description: Maximum number of items
          schema:
            type: integer
        - name: offset
          in: query
          description: Number of items to skip
          schema:
            type: integer
        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Entity tag
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
              example:
                - id: b1
                  title: Dune
                  pageCount: 412
        '304':
          description: Not modified
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createBook
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /books/{bookId}:
    parameters:
      - name: bookId
        in: path
        required: true
        description: Identifier of the book
        schema:
          type: string
    get:
      operationId: getBook
      summary: Get a book
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteBook
      description: Delete a book
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
  /getStats:
    get:
      operationId: getStats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  average:
                    type: number
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        pageCount:
          type: integer
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
